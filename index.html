<style>
/* Layout: navy sidebar com as 5 abas + barra de filtros fixa no topo do conteúdo; cards de KPI, depois gráficos e tabelas em grade responsiva */
:root{
  --bg:#F3F5FA; --surface:#FFFFFF; --surface-2:#F7F9FC; --fg:#0B1433; --muted:#5A6382; --line:#DDE2EE; --grid:#E6EAF3;
  --brand:#060F30; --brand-green:#3CB54A; --accent:#23803A;
  --series:#2B4C9B; --series-2:#3CB54A;
  --good:#1E8E3E; --warn:#A86400; --bad:#C62828; --info:#1F6FD1; --neutral:#6F7892;
  --good-bg:#E6F4EA; --warn-bg:#FFF3DE; --bad-bg:#FDECEC; --info-bg:#E8F0FC; --neutral-bg:#EEF0F5;
  --side-bg:#060F30; --side-fg:#E6EAF5; --side-muted:#8D97B8; --side-active:#13204F;
  --font-display:"Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --font-body:"Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#070B1C; --surface:#0F162D; --surface-2:#131B36; --fg:#E7EBF5; --muted:#9AA3BD; --line:#26304D; --grid:#1D2641;
  --accent:#4CC95A; --series:#7392E3; --series-2:#4CC95A;
  --good:#4CC95A; --warn:#E3A23B; --bad:#EF6B6B; --info:#6BA8F5; --neutral:#8D96B0;
  --good-bg:#12301C; --warn-bg:#33270F; --bad-bg:#3A1518; --info-bg:#132845; --neutral-bg:#1C2440;
  --side-bg:#040817; --side-active:#16224A; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#070B1C; --surface:#0F162D; --surface-2:#131B36; --fg:#E7EBF5; --muted:#9AA3BD; --line:#26304D; --grid:#1D2641;
  --accent:#4CC95A; --series:#7392E3; --series-2:#4CC95A;
  --good:#4CC95A; --warn:#E3A23B; --bad:#EF6B6B; --info:#6BA8F5; --neutral:#8D96B0;
  --good-bg:#12301C; --warn-bg:#33270F; --bad-bg:#3A1518; --info-bg:#132845; --neutral-bg:#1C2440;
  --side-bg:#040817; --side-active:#16224A; color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.45}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0}
.num,td.n,.kv{font-variant-numeric:tabular-nums}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--series);outline-offset:2px}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{background:var(--side-bg);color:var(--side-fg);padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow:auto}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:-.02em;padding:0 8px}
.logo .dot{width:18px;height:18px;border-radius:50%;background:var(--brand-green);display:inline-grid;place-items:center}
.logo .dot::after{content:"";border-left:6px solid #060F30;border-top:4px solid transparent;border-bottom:4px solid transparent;margin-left:2px}
.side small{color:var(--side-muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em;padding:0 8px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:8px;color:var(--side-fg);font-weight:500}
.nav button:hover{background:var(--side-active)}
.nav button[aria-current="page"]{background:var(--side-active);box-shadow:inset 3px 0 0 var(--brand-green)}
.nav button:focus-visible{outline:2px solid var(--brand-green)}
.nav .k{font-family:var(--font-display);color:var(--side-muted);font-size:12px;width:16px}
.side .src{font-size:12px;color:var(--side-muted);padding:0 8px;line-height:1.5}
.side .src b{color:var(--side-fg);font-weight:600}
.main{min-width:0;padding-block:20px 40px;padding-left:max(24px, env(safe-area-inset-left,0px));padding-right:max(24px, env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.head h1{font-size:26px;letter-spacing:-.02em}
.head p{margin:4px 0 0;color:var(--muted)}
.filters{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-wrap:wrap;gap:10px 12px;align-items:flex-end}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}
.f label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.f select,.f input{background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:6px 8px;max-width:270px}
.f select:disabled,.f input:disabled{opacity:.5;cursor:not-allowed}
.f.w{flex:1 1 180px}.f.w input{max-width:none;width:100%}
.btn{background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:6px 10px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--series)}
.btn.pri{background:var(--brand);color:#fff;border-color:var(--brand)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .l{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.kpi .v{font-family:var(--font-display);font-size:22px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi .s{font-size:12px;color:var(--muted)}
.delta{font-size:12px;font-weight:600;display:inline-flex;gap:4px;align-items:center}
.delta.up{color:var(--good)}.delta.down{color:var(--bad)}.delta.flat{color:var(--neutral)}
.tag{font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:1px 6px;border-radius:4px;white-space:nowrap;align-self:flex-start}
.tag.real{background:var(--info-bg);color:var(--info)}
.tag.der{background:var(--neutral-bg);color:var(--neutral)}
.tag.nd{background:var(--warn-bg);color:var(--warn)}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c7{grid-column:span 7}.c6{grid-column:span 6}.c5{grid-column:span 5}.c4{grid-column:span 4}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0;display:flex;flex-direction:column;gap:10px}
.card h2{font-size:16px;font-weight:600}
.card .sub{color:var(--muted);font-size:12px;margin-top:-6px}
.note{font-size:12px;color:var(--muted);border-left:3px solid var(--line);padding-left:8px}
.note.warn{border-color:var(--warn)}
.tbl{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface);position:sticky;top:0}
th.s{cursor:pointer}th.s:hover{color:var(--fg)}
td{padding:7px 8px;border-bottom:1px solid var(--grid);vertical-align:top}
td.n,th.n{text-align:right;white-space:nowrap}
tr.top10 td:first-child{box-shadow:inset 3px 0 0 var(--series)}
tr.drop10 td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-crescimento{background:var(--good-bg);color:var(--good)}
.st-queda{background:var(--warn-bg);color:var(--warn)}
.st-inativa{background:var(--bad-bg);color:var(--bad)}
.st-estavel{background:var(--neutral-bg);color:var(--neutral)}
.st-semcomp{background:var(--neutral-bg);color:var(--muted)}
.st-nova{background:var(--info-bg);color:var(--info)}
.seg{font-size:10px;font-weight:700;letter-spacing:.05em;padding:2px 6px;border-radius:4px;border:1px solid var(--line);white-space:nowrap}
.seg.HEAD{background:var(--brand);color:#fff;border-color:var(--brand)}
.seg.MEDIUM{background:var(--info-bg);color:var(--info);border-color:transparent}
.seg.LONG{color:var(--muted)}
.mini{font-size:11px;color:var(--muted)}
.heat{display:grid;grid-template-columns:42px repeat(7,minmax(28px,1fr));gap:2px;font-size:11px;min-width:360px}
.heat div{padding:3px 2px;text-align:center;border-radius:3px;font-variant-numeric:tabular-nums}
.heat .h{color:var(--muted);text-align:right;padding-right:6px}
.heat .x{background:repeating-linear-gradient(135deg,var(--grid) 0 3px,transparent 3px 7px)}
.lists{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.li{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:var(--surface-2)}
.li h3{font-size:14px;display:flex;justify-content:space-between;gap:6px;align-items:center}
.li ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:12.5px}
.li li{display:flex;justify-content:space-between;gap:8px}
.li li span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ins{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.insc{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.insc .t{font-family:var(--font-display);font-weight:600;font-size:15px}
.insc .r{display:grid;grid-template-columns:86px 1fr;gap:4px 8px;font-size:12.5px}
.insc .r b{color:var(--muted);font-weight:500}
.tip{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-size:12px;color:var(--fg);box-shadow:0 4px 14px rgba(0,0,0,.12)}
.tip .tl{color:var(--muted);margin-bottom:2px}
.quad{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px}
.quad div{border:1px solid var(--line);border-radius:6px;padding:8px}
.quad b{display:block;font-size:20px;font-family:var(--font-display)}
.dq li{margin-bottom:6px}
.ok{color:var(--good);font-weight:600}.bad{color:var(--bad);font-weight:600}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:20px;text-align:center;color:var(--muted)}
.drop.on{border-color:var(--series);color:var(--fg)}
.pdft th.pc{text-align:center;font-size:12px;text-transform:none;letter-spacing:0;font-weight:500;border-left:1px solid var(--line)}
.pdft td.pc{text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums;border-left:1px solid var(--line)}
.pdft tr.pzebra td.plab,.pdft tr.pzebra td.pc{background:var(--surface-2)}
.ptitle{text-align:center;font-size:20px!important;font-weight:500!important}
.pdft td.pname{font-weight:600;font-size:12px;max-width:180px;border-right:1px solid var(--grid)}
.pdft td.plab{color:var(--muted);font-size:12px;white-space:nowrap}
.pdft tr.pfirst td{border-top:1px solid var(--line)}
.pdft td{border-bottom:none;padding:4px 8px}
.busca{position:relative}.busca-box{position:relative}
.busca-box input{width:100%;padding-right:28px!important}
.busca-x{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;cursor:pointer;font-size:16px;color:var(--muted)}
.busca-list{position:absolute;z-index:20;left:0;right:0;top:calc(100% + 4px);margin:0;padding:4px;list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.14);max-height:280px;overflow:auto}
.busca-list li{padding:6px 8px;border-radius:6px;cursor:pointer;font-size:13px}
.busca-list li.on,.busca-list li:hover{background:var(--surface-2)}
code{background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:1px 4px;font-size:12px}
.recharts-text{fill:var(--muted)}
.recharts-cartesian-axis-tick-value tspan{fill:var(--muted)}
@media (max-width:1100px){.c8,.c7,.c6,.c5,.c4{grid-column:span 12}}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px max(16px, env(safe-area-inset-right,0px)) 12px max(16px, env(safe-area-inset-left,0px));gap:10px}
  .side small,.side .src{display:none}
  .nav{flex-direction:row;overflow-x:auto;width:100%}
  .nav button{white-space:nowrap}
  .main{padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

/* ---------- segmentação HEAD / MEDIUM / LONG TAIL ---------- */
function segment(rows,key,t1,t2){const arr=rows.filter(r=>isNum(r[key])&&r[key]>0).sort((a,b)=>b[key]-a[key]);
  const tot=arr.reduce((s,r)=>s+r[key],0); const out={}; let cum=0, phase=0;
  for(const r of arr){ const lab=phase===0?"HEAD":phase===1?"MEDIUM":"LONG TAIL"; out[r.name]=lab; cum+=r[key];
    const c=cum/tot*100; if(phase===0&&c>=t1) phase=1; if(phase===1&&c>=t2) phase=2; }
  return out;}

    else if(ch==='"')q=true;else if(ch===delim){row.push(f);f="";}else if(ch==="\n"){row.push(f);rows.push(row);row=[];f="";}else if(ch!=="\r")f+=ch;}

const norm=s=>String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"_").replace(/^_|_$/g,"");
const COLS={data:/^(data|date|dt|data_corrida|data_hora|datahora|dt_corrida|data_inicio|inicio)$/,hora:/^(hora|hour|horario|hora_inicio)$/,empresa:/(empresa|cliente|company|razao_social|conta)/,grupo:/grupo/,id:/^(id|id_corrida|idtr|id_transacao|corrida|transacao|id_viagem)$/,status:/(status|situacao)/,valor:/^(valor|volume|amount|valor_total|total|preco|valor_corrida)$/,canalCh:/(canal_chamada|canal_de_chamada|origem)/,canalPg:/(canal_pagamento|canal_de_pagamento|forma_pagamento|meio_pagamento)/,usuario:/(usuario|user|passageiro|colaborador|funcionario)/};
function mapCols(keys){const m={};for(const [c,re] of Object.entries(COLS)){const k=keys.find(k=>re.test(norm(k))&&!Object.values(m).includes(k));if(k)m[c]=k;}return m;}

  if(s.includes(",")&&(s.lastIndexOf(",")>s.lastIndexOf(".")))s=s.replace(/\./g,"").replace(",",".");else s=s.replace(/,/g,"");return parseFloat(s);}
function parseDate(v){ if(v instanceof Date&&!isNaN(v))return v; if(typeof v==="number"&&v>20000&&v<80000){return new Date(Math.round((v-25569)*86400000)+new Date().getTimezoneOffset()*60000);}
  const s=String(v).trim();let m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})(?:[ T](\d{1,2}):(\d{2}))?/);
  if(m){let y=+m[3];if(y<100)y+=2000;return new Date(y,+m[2]-1,+m[1],m[4]?+m[4]:0,m[5]?+m[5]:0);}
  m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T](\d{1,2}):(\d{2}))?/);if(m)return new Date(+m[1],+m[2]-1,+m[3],m[4]?+m[4]:0,m[5]?+m[5]:0);return null;}

const OK_RE=/(conclu|finaliz|fechad|realiz|complet|done|encerr|paga|efetiv)/i, CANCEL_RE=/(cancel|recus|nao_atend|não atend|expir)/i;
function normalizeRows(raw){const keys=Object.keys(raw[0]||{});const m=mapCols(keys);const issues=[];
  ["data","empresa","valor"].forEach(c=>{if(!m[c])issues.push("Coluna obrigatória não encontrada: "+c);});
  if(issues.length)return {rows:[],m,issues,keys};
  let bad=0;const rows=[];
  for(const r of raw){const d=parseDate(r[m.data]);const val=parseNumBR(r[m.valor]);const emp=String(r[m.empresa]||"").trim();
    if(!d||!emp){bad++;continue;}

function buildCsvModel(cfg,rowsAll,f){
  const maxTs=Math.max(...rowsAll.map(r=>r.ts)),minTs=Math.min(...rowsAll.map(r=>r.ts));
  const span=Math.round((maxTs-minTs)/DAY)+1; const win=cfg.csvWin==="all"?span:Math.min(+cfg.csvWin,span);
  const end=maxTs, start=maxTs-(win-1)*DAY, pEnd=start-DAY, pStart=start-win*DAY; const hasPrev=cfg.csvWin!=="all"&&pEnd>=minTs;
  const pass=r=>(!f.grupo||r.grupo===f.grupo)&&(!f.canalCh||r.canalCh===f.canalCh)&&(!f.canalPg||r.canalPg===f.canalPg)&&(f.dow===""||r.dow===+f.dow)&&(!f.band||(r.hour!=null&&r.hour>=BANDS.find(x=>x.k===f.band).a&&r.hour<=BANDS.find(x=>x.k===f.band).b));
  const cur=rowsAll.filter(r=>r.ts>=start&&r.ts<=end&&pass(r)), prev=hasPrev?rowsAll.filter(r=>r.ts>=pStart&&r.ts<=pEnd&&pass(r)):[];
  const occ=Array(7).fill(0);for(let t=start;t<=end;t+=DAY)occ[new Date(t).getDay()]++;
  const map=new Map();const get=n=>{if(!map.has(n))map.set(n,{name:n,full:n,grupo:null,vol:0,trans:0,prevVol:0,prevTrans:0,dVol:Array(7).fill(0),dTr:Array(7).fill(0),hTr:Array(24).fill(0),last:null,h1:0,h2:0,users:new Set()});return map.get(n);};
  const mid=start+Math.floor(win/2)*DAY;
  for(const r of rowsAll){const o=get(r.empresa);if(r.grupo)o.grupo=r.grupo;if(r.ok&&(o.last===null||r.ts>o.last))o.last=r.ts;}
  for(const r of cur){if(!r.ok)continue;const o=get(r.empresa);o.vol+=r.valor||0;o.trans++;o.dVol[r.dow]+=r.valor||0;o.dTr[r.dow]++;if(r.hour!=null)o.hTr[r.hour]++;if(r.ts<mid)o.h1+=r.valor||0;else o.h2+=r.valor||0;if(r.usuario)o.users.add(r.usuario);}
  for(const r of prev){if(!r.ok)continue;const o=get(r.empresa);o.prevVol+=r.valor||0;o.prevTrans++;}
  const companies=[...map.values()].map(o=>{const present=o.trans>0,presentPrev=hasPrev&&o.prevTrans>0;
    let bd=null,bda=null;if(present){bd=o.dVol.indexOf(Math.max(...o.dVol));const avg=o.dVol.map((v,i)=>occ[i]?v/occ[i]:0);bda=avg.indexOf(Math.max(...avg));}
    const bh=present&&o.hTr.some(x=>x)?o.hTr.indexOf(Math.max(...o.hTr)):null;
    return {name:o.name,full:o.name,grupo:o.grupo,present,presentPrev,vol:o.vol,trans:o.trans,prevVol:presentPrev?o.prevVol:null,prevTrans:presentPrev?o.prevTrans:null,
      varVol:presentPrev&&present?pctVar(o.vol,o.prevVol):null,varTrans:presentPrev&&present?pctVar(o.trans,o.prevTrans):null,ticket:o.trans?o.vol/o.trans:null,prevTicket:o.prevTrans?o.prevVol/o.prevTrans:null,
      bestDay:bd,bestDayAvg:bda,bestHour:bh,daysSince:o.last!=null?Math.round((maxTs-o.last)/DAY):null,consistente:o.h2>o.h1,usuarios:o.users.size,recorrencia:null};})
    .filter(r=>r.present||r.presentPrev||(r.daysSince!=null));
  return {source:"csv",companies,cur,prev,occ,start,end,pStart,pEnd,hasPrev,win,maxTs,minTs,baseLabel:fDate(start)+" a "+fDate(end),compLabel:hasPrev?fDate(pStart)+" a "+fDate(pEnd):"sem período anterior",
    periodo:"Base transacional: "+fDate(start)+" a "+fDate(end)+(hasPrev?" vs "+fDate(pStart)+" a "+fDate(pEnd):""),sameWeekday:true};}

function classify(model,cfg){const t=cfg;
  const segV=segment(model.companies,"vol",t.t1,t.t2), segT=segment(model.companies,"trans",t.t1,t.t2);
  const segPrev=segment(model.companies.map(r=>({name:r.name,v:r.prevVol})),"v",t.t1,t.t2);
  const tot=model.companies.reduce((s,r)=>s+(r.present?r.vol:0),0);
  model.companies.forEach(r=>{r.seg=segV[r.name]||null;r.segT=segT[r.name]||null;r.segPrev=segPrev[r.name]||null;r.share=r.present&&tot?r.vol/tot*100:null;
    let s;
    if(model.semComp) s="semcomp";
    else if(model.source==="csv"&&r.daysSince!=null&&r.daysSince>=t.inactDays) s="inativa";
    else if(!r.present&&r.presentPrev) s="inativa";
    else if(r.present&&!r.presentPrev) s="nova";
    else if(!r.present) s="inativa";
    else if(r.varVol>=t.grow) s="crescimento";
    else if(r.varVol<=-t.drop) s="queda";
    else s="estavel";
    r.status=s;});
  const act=model.companies.filter(r=>r.present).sort((a,b)=>b.vol-a.vol);
  act.forEach((r,i)=>r.rank=i+1);
  model.total=tot; model.top10Share=act.slice(0,10).reduce((s,r)=>s+r.vol,0)/tot*100;
  model.headShare=act.filter(r=>r.seg==="HEAD").reduce((s,r)=>s+r.vol,0)/tot*100;
  const drops=model.companies.filter(r=>isNum(r.prevVol)&&r.prevVol>0).map(r=>({r,d:(r.present?r.vol:0)-r.prevVol})).filter(x=>x.d<0).sort((a,b)=>a.d-b.d).slice(0,10);
  model.drop10=new Set(drops.map(x=>x.r.name)); model.dropList=drops;
  model.top10=new Set(act.slice(0,10).map(r=>r.name));
  return model;}

    out.push({t:"Dia com maior demanda",a:"Indisponível com o PDF: o gráfico Volume Semana traz apenas domingo (22/11). Entre os 5 recortes, o maior volume é de 22/10/2026 (quinta), mas é uma observação isolada.",ind:"Volume por dia da semana",acao:"Importar a base transacional para calcular volume absoluto e média por ocorrência de cada dia.",per:"Recortes do relatório",k:"nd"});}
  else{const dv=Array(7).fill(0);M.cur.filter(r=>r.ok).forEach(r=>dv[r.dow]+=r.valor||0);const avg=dv.map((v,i)=>M.occ[i]?v/M.occ[i]:0);
    out.push({t:"Dia com maior demanda",a:"Maior volume absoluto: "+DOW[dv.indexOf(Math.max(...dv))]+" ("+fBRL(Math.max(...dv))+"). Melhor média por ocorrência: "+DOW[avg.indexOf(Math.max(...avg))]+" ("+fBRL(Math.max(...avg))+"/dia).",ind:"Volume por dia da semana, absoluto e médio",acao:"Ajustar escala de atendimento e comunicação aos dias de maior uso.",per,k:"der"});
    const hv=Array(24).fill(0);M.cur.filter(r=>r.ok&&r.hour!=null).forEach(r=>hv[r.hour]++);out.push({t:"Horário de pico",a:"Pico às "+hv.indexOf(Math.max(...hv))+"h com "+fInt(Math.max(...hv))+" corridas.",ind:"Corridas por hora",acao:"Garantir oferta de motoristas no horário de pico.",per,k:"der"});}
  const atencao=M.companies.filter(r=>(r.seg==="HEAD"||r.seg==="MEDIUM"||r.segPrev==="HEAD"||r.segPrev==="MEDIUM")&&(r.status==="queda"||r.status==="inativa")).sort((a,b)=>(b.prevVol||0)-(a.prevVol||0)).slice(0,6);
  if(atencao.length)out.push({t:"Atenção prioritária do relacionamento",a:atencao.map(r=>r.name).join("; ")+".",ind:"Contas HEAD/MEDIUM (atuais ou anteriores) em queda ou sem movimento",acao:"Incluir na pauta semanal de CS com dono e prazo definidos.",per,k:"der"});
  return out;}

function BuscaEmpresa({names,value,onChange}){const [q,setQ]=useState(value||"");const [open,setOpen]=useState(false);const [hi,setHi]=useState(0);
  useEffect(()=>{setQ(value||"");},[value]);
  const nq=norm(q);const list=(value&&q===value?names:names.filter(n=>norm(n).includes(nq))).slice(0,50);
  const pick=n=>{onChange(n);setQ(n);setOpen(false);};
  return html`<div class="f w busca"><label for="fe">Empresa</label>
    <div class="busca-box"><input id="fe" type="text" role="combobox" aria-expanded=${open} aria-controls="fe-list" autocomplete="off" placeholder="Buscar empresa…" value=${q}
      onFocus=${()=>setOpen(true)} onBlur=${()=>setTimeout(()=>setOpen(false),150)}
      onInput=${e=>{setQ(e.target.value);setOpen(true);setHi(0);if(!e.target.value)onChange("");}}
      onKeyDown=${e=>{if(e.key==="ArrowDown"){e.preventDefault();setHi(h=>Math.min(h+1,list.length-1));}else if(e.key==="ArrowUp"){e.preventDefault();setHi(h=>Math.max(h-1,0));}else if(e.key==="Enter"&&list[hi]){e.preventDefault();pick(list[hi]);}else if(e.key==="Escape")setOpen(false);}}/>
      ${value?html`<button class="busca-x" aria-label="Limpar empresa" onMouseDown=${e=>e.preventDefault()} onClick=${()=>{onChange("");setQ("");}}>×</button>`:null}
      ${open?html`<ul id="fe-list" role="listbox" class="busca-list">${list.length?list.map((n,i)=>html`<li role="option" aria-selected=${i===hi} class=${i===hi?"on":""} onMouseDown=${e=>{e.preventDefault();pick(n);}}>${n}</li>`):html`<li class="mini">Nenhuma empresa encontrada</li>`}</ul>`:null}
    </div></div>`;}

/* Tabela no mesmo formato do PDF: Volume / Variação / Count of Idtr.. por data */
function PdfTable({titulo,itens,base,comCount,filtro,semBusca}){const D=REPORT.dates;const [q,setQ]=useState("");
  const cor=v=>!isNum(v)?"":v>0?"var(--good)":v>-10?"var(--warn)":"var(--bad)";
  const lista=itens.filter(e=>e.v[base]!=null||e.v.some(x=>x!=null)).filter(e=>!q||e.n.toLowerCase().includes(q.toLowerCase())).filter(e=>!filtro||filtro(e))
    .sort((a,b)=>{const va=a.v[base],vb=b.v[base];if(va!=null&&vb!=null)return vb-va;if(va!=null)return -1;if(vb!=null)return 1;return 0;});
  const varOf=(e,i)=>{const b=e.v[base],x=e.v[i];if(x==null)return null;if(i===base)return 0;return b==null?-100:(b/x-1)*100;};
  return html`<div class="card c12"><h2 class="ptitle">${titulo}</h2><div class="sub">Mesmo cabeçalho do relatório. Variação = data base (${D[base].k}) comparada a cada data, como no PDF.</div>
    ${semBusca?null:html`<div class="f w" style=${{maxWidth:"360px",flex:"none"}}><label for=${"pq"+titulo}>Pesquisar</label><input id=${"pq"+titulo} type="search" placeholder="Digite parte do nome" value=${q} onInput=${e=>setQ(e.target.value)}/></div>`}
    <div class="tbl" style=${{maxHeight:"620px",overflow:"auto"}}><table class="pdft"><thead><tr><th></th><th></th>${D.map(d=>html`<th class="pc">${enDateDow(d.k)}</th>`)}</tr></thead>
    <tbody>${lista.map(e=>{const linhas=[["Volume",i=>e.v[i]!=null?fBRL(e.v[i]):""],["Variação",i=>{const v=varOf(e,i);return v==null?"":v.toFixed(2)+"%";}]].concat(comCount?[["Count of Idtr..",i=>e.t[i]!=null?fInt(e.t[i]):""]]:[]);
      return linhas.map((l,j)=>html`<tr class=${(j===0?"pfirst ":"")+(j===1?"pzebra":"")}>${j===0?html`<td rowspan=${linhas.length} class="pname">${e.n}</td>`:null}<td class="plab">${l[0]}</td>${D.map((d,i)=>html`<td class="pc" style=${{color:i===base?"var(--fg)":cor(varOf(e,i))}}>${l[1](i)}</td>`)}</tr>`);})}</tbody></table></div>
    <div class="mini">${lista.length} linha(s). Count of Idtr.. = contagem de IDs de transação (não equivale a corridas concluídas). Cores: verde, a data base está acima; laranja, queda de até 10%; vermelho, queda maior.</div></div>`;}

function TabRanking({M,f,setF,cfgBase}){const T=useContext(TokCtx);const [sort,setSort]=useState({k:"vol",d:-1});const [q,setQ]=useState("");
  const rows=useMemo(()=>{let r=applyFilters(M.companies,f);if(q)r=r.filter(x=>x.name.toLowerCase().includes(q.toLowerCase()));
    const k=sort.k;return [...r].sort((a,b)=>{const va=a[k],vb=b[k];if(va==null&&vb==null)return 0;if(va==null)return 1;if(vb==null)return -1;return (typeof va==="string"?va.localeCompare(vb):va-vb)*sort.d;});},[M,f,q,sort]);
  const act=rows.filter(r=>r.present);
  const topV=[...act].sort((a,b)=>b.vol-a.vol).slice(0,15).map(r=>({name:short(r.name),full:r.name,v:r.vol,seg:r.seg}));
  const topT=[...act].sort((a,b)=>b.trans-a.trans).slice(0,15).map(r=>({name:short(r.name),full:r.name,v:r.trans,seg:r.segT}));
  const drops=M.dropList.filter(x=>rows.includes(x.r)).map(x=>({name:short(x.r.name),full:x.r.name,v:x.d,extra:fBRL(x.r.prevVol)+" → "+(x.r.present?fBRL(x.r.vol):"sem movimento")}));
  const H=(k,l,n)=>html`<th class=${"s"+(n?" n":"")} onClick=${()=>setSort(s=>({k,d:s.k===k?-s.d:-1}))} aria-sort=${sort.k===k?(sort.d>0?"ascending":"descending"):"none"}>${l}${sort.k===k?(sort.d>0?" ▲":" ▼"):""}</th>`;
  const pdf=M.source==="pdf";
  const segCol=d=>d.seg==="HEAD"?T.series:d.seg==="MEDIUM"?T.info:T.neutral;
  return html`<div class="grid">
    <div class="card c6"><h2>Top 15 por volume</h2><div class="sub">${M.baseLabel}. Cor indica a segmentação por volume.</div><${HBar} data=${topV} dk="v" name="Volume" fmt=${fBRL} colorBy=${segCol}/>

function TabTempo({M,f}){const T=useContext(TokCtx);const pdf=M.source==="pdf";
  let hourly,heat,dowRows,note;
  if(pdf){const H=REPORT.hourly;const inBand=h=>!f.band||(h>=BANDS.find(x=>x.k===f.band).a&&h<=BANDS.find(x=>x.k===f.band).b);
    const okDow=f.dow===""||+f.dow===0;
    hourly=[...Array(24).keys()].filter(inBand).map(h=>({name:h+"h",trans:okDow?(H.trans[h]??null):null,vol:okDow?(H.vol[h]??null):null,extra:H.trans[h]==null?"Sem transações no gráfico":null}));
    heat=[...Array(24).keys()].map(h=>DOWS.map((d,i)=>i===0&&inBand(h)&&okDow?(H.trans[h]??0):null));
    dowRows=REPORT.dates.map((d,i)=>({name:d.k+" ("+d.dow+")",vol:REPORT.daily.vol[i],trans:REPORT.daily.trans[i],ticket:REPORT.daily.ticket[i]}));
    note=f.empresa?"O PDF não traz horários por empresa. O gráfico mostra o total da operação.":null;}
  else{const rows=M.cur.filter(r=>r.ok&&(!f.empresa||r.empresa===f.empresa)&&r.hour!=null);
    const ht=Array(24).fill(0),hv=Array(24).fill(0);const hm=[...Array(24)].map(()=>Array(7).fill(0));
    rows.forEach(r=>{ht[r.hour]++;hv[r.hour]+=r.valor||0;hm[r.hour][r.dow]++;});
    hourly=ht.map((t,h)=>({name:h+"h",trans:t,vol:hv[h]}));heat=hm;
    const all=M.cur.filter(r=>r.ok&&(!f.empresa||r.empresa===f.empresa));const dv=Array(7).fill(0),dt=Array(7).fill(0);all.forEach(r=>{dv[r.dow]+=r.valor||0;dt[r.dow]++;});
    dowRows=DOW.map((d,i)=>({name:d,vol:dv[i],trans:dt[i],occ:M.occ[i],avgV:M.occ[i]?dv[i]/M.occ[i]:null,avgT:M.occ[i]?dt[i]/M.occ[i]:null,ticket:dt[i]?dv[i]/dt[i]:null}));}
  const mx=Math.max(1,...heat.flat().filter(isNum));
  const peakT=[...hourly].filter(x=>isNum(x.trans)).sort((a,b)=>b.trans-a.trans)[0];
  const wk=!pdf?(()=>{const u=dowRows.slice(1,6),w=[dowRows[0],dowRows[6]];const s=(a,k)=>a.reduce((x,y)=>x+(y[k]||0),0);const ou=s(u,"occ"),ow=s(w,"occ");return {uV:ou?s(u,"vol")/ou:null,wV:ow?s(w,"vol")/ow:null,uT:ou?s(u,"trans")/ou:null,wT:ow?s(w,"trans")/ow:null};})():null;
  return html`<div class="grid">
    ${note?html`<div class="note warn c12">${note}</div>`:null}
    <div class="card c6"><h2>Transações por hora</h2><div class="sub">${pdf?"22/11/2026 (domingo), p.4 do relatório":M.baseLabel+(f.empresa?" • "+f.empresa:"")}</div>
      <${VBar} data=${hourly} dk="trans" name=${pdf?"Transações":"Corridas"} fmt=${fInt} h=${230} iv=${hourly.length>12?1:0}/>
      ${peakT?html`<div class="mini">Pico: <b>${peakT.name}</b> com ${fInt(peakT.trans)}.</div>`:null}</div>
    <div class="card c6"><h2>Volume por hora</h2><div class="sub">Mesma base, em R$${pdf?" (rótulos arredondados no gráfico original)":""}</div>
      <${VBar} data=${hourly} dk="vol" name="Volume" fmt=${fBRL} h=${230} color=${T.series2} iv=${hourly.length>12?1:0}/></div>
    <div class="card c7"><h2>Mapa de calor: dia da semana × hora</h2><div class="sub">${pdf?"Com o PDF só há dados de domingo. Demais dias aparecem hachurados (sem dado, não zero).":"Corridas concluídas no período"}</div>
      <div class="tbl"><div class="heat" role="table" aria-label="Mapa de calor">
        <div></div>${DOWS.map(d=>html`<div class="h" style=${{textAlign:"center",paddingRight:0}}>${d}</div>`)}
        ${heat.map((row,h)=>html`<div class="h">${h}h</div>${row.map((v,i)=>v==null?html`<div class="x" title=${DOW[i]+" "+h+"h: sem dado"}></div>`:html`<div title=${DOW[i]+" "+h+"h: "+v} style=${{background:v?`color-mix(in oklab, ${T.series} ${Math.round(15+85*v/mx)}%, ${T.surface})`:"var(--surface-2)",color:v/mx>.55?"#fff":"var(--fg)"}}>${v||""}</div>`)}`)}
      </div></div></div>
    <div class="card c5"><h2>Dias da semana</h2>
      ${pdf?html`<div class="sub">Recortes disponíveis no PDF (uma observação por data)</div>
        <div class="tbl"><table><thead><tr><th>Data</th><th class="n">Volume</th><th class="n">Trans.</th><th class="n">Ticket</th></tr></thead><tbody>
        ${dowRows.map(r=>html`<tr><td>${r.name}</td><td class="n">${fBRL(r.vol)}</td><td class="n">${fInt(r.trans)}</td><td class="n">${fBRL(r.ticket)}</td></tr>`)}</tbody></table></div>
        <div class="note warn">Melhor dia da semana (absoluto e médio), comparação dias úteis × fim de semana e dias de menor uso exigem a base transacional com data e hora. Ticket de 22/11/2025 sem a UBER (PDF: R$ 51,64). Os recortes acima têm datas de naturezas diferentes (feriado, sábado, quinta) e não formam média.</div>`
      :html`<div class="tbl"><table><thead><tr><th>Dia</th><th class="n">Ocorr.</th><th class="n">Volume</th><th class="n">Média/dia</th><th class="n">Corridas</th><th class="n">Ticket</th></tr></thead><tbody>
        ${dowRows.map(r=>html`<tr><td>${r.name}</td><td class="n">${r.occ}</td><td class="n">${fBRL(r.vol)}</td><td class="n">${fBRL(r.avgV)}</td><td class="n">${fInt(r.trans)}</td><td class="n">${fBRL(r.ticket)}</td></tr>`)}</tbody></table></div>
        <div class="quad"><div>Média/dia útil<b>${fBRL(wk.uV)}</b>${fInt(wk.uT)} corridas</div><div>Média/dia fim de semana<b>${fBRL(wk.wV)}</b>${fInt(wk.wT)} corridas</div></div>
        <div class="note">"Volume" é o total absoluto; "Média/dia" divide pelo número de vezes que o dia aparece no período, o que corrige meses com 5 segundas e 4 sextas, por exemplo.</div>`}</div>
  </div>`;}

function TabRisco({M,cfg,setCfg,f}){const T=useContext(TokCtx);const rows=applyFilters(M.companies,f);const pdf=M.source==="pdf";
  const by=s=>rows.filter(r=>r.status===s);
  const grow=by("crescimento").sort((a,b)=>b.varVol-a.varVol), dec=by("queda").sort((a,b)=>a.varVol-b.varVol), ina=by("inativa").sort((a,b)=>(b.prevVol||0)-(a.prevVol||0)), nova=by("nova").sort((a,b)=>b.vol-a.vol);
  const act=rows.filter(r=>r.present);const tks=act.filter(r=>isNum(r.ticket)).map(r=>r.ticket).sort((a,b)=>a-b);const p75=tks[Math.floor(tks.length*.75)]||0;
  const trs=act.map(r=>r.trans).sort((a,b)=>a-b);const med=trs[Math.floor(trs.length/2)]||0;
  const opp=act.filter(r=>r.ticket>=p75&&r.trans<=med).sort((a,b)=>b.ticket-a.ticket);
  const risk=rows.filter(r=>(r.seg==="HEAD"||r.segPrev==="HEAD")&&(r.status==="queda"||r.status==="inativa"));
  const sc=rows.filter(r=>r.present&&isNum(r.varVol)).map(r=>({name:r.name,full:r.name,x:r.vol,y:Math.max(-100,Math.min(300,r.varVol)),realY:r.varVol,status:r.status}));
  const medV=(()=>{const v=sc.map(d=>d.x).sort((a,b)=>a-b);return v[Math.floor(v.length/2)]||1;})();
  const qd={hh:sc.filter(d=>d.x>=medV&&d.y>=cfg.grow),hl:sc.filter(d=>d.x>=medV&&d.y<cfg.grow),lh:sc.filter(d=>d.x<medV&&d.y>=cfg.grow),ll:sc.filter(d=>d.x<medV&&d.y<cfg.grow)};
  const L=(title,arr,val,s)=>html`<div class="li"><h3><span>${title}</span><span class=${"pill st-"+s}>${arr.length}</span></h3>
    ${arr.length?html`<ul>${arr.slice(0,8).map(r=>html`<li><span title=${r.name}>${r.name}</span><span class="num">${val(r)}</span></li>`)}</ul>`:html`<div class="mini">Nenhuma empresa.</div>`}${arr.length>8?html`<div class="mini">+${arr.length-8} na aba Ranking</div>`:null}</div>`;
  const ScTip=({active,payload})=>active&&payload&&payload.length?html`<div class="tip"><div class="tl">${payload[0].payload.full}</div><div>Volume: <b>${fBRL(payload[0].payload.x)}</b></div><div>Variação: <b>${fPct(payload[0].payload.realY)}</b></div></div>`:null;
  return html`<div class="grid">
    <div class="card c12"><h2>Critérios de alerta</h2>
      <div style=${{display:"flex",gap:"14px",flexWrap:"wrap",alignItems:"flex-end"}}>
        <div class="f"><label for="cd">Queda a partir de</label><select id="cd" value=${cfg.drop} onChange=${e=>setCfg({...cfg,drop:+e.target.value})}>${[10,15,20,30,40,50].map(v=>html`<option value=${v}>${v}%</option>`)}</select></div>
        <div class="f"><label for="cg">Crescimento a partir de</label><select id="cg" value=${cfg.grow} onChange=${e=>setCfg({...cfg,grow:+e.target.value})}>${[5,10,15,20,30].map(v=>html`<option value=${v}>${v}%</option>`)}</select></div>
        <div class="f"><label for="ci">Inatividade (sem corrida há)</label><select id="ci" disabled=${pdf} value=${cfg.inactDays} onChange=${e=>setCfg({...cfg,inactDays:+e.target.value})}>${[15,30,60].map(v=>html`<option value=${v}>${v} dias</option>`)}</select></div>
        <span class="mini" style=${{maxWidth:"520px"}}>${pdf?"Com o PDF, inatividade significa: movimentou na data de comparação e não aparece na data base. Contagem em dias requer a base transacional.":"Inatividade: empresas com histórico e sem corrida concluída há pelo menos "+cfg.inactDays+" dias até "+fDate(M.maxTs)+"."}</span></div></div>
    <div class="card c12"><h2>Status da carteira</h2><div class="sub">${M.baseLabel} vs ${M.compLabel}</div>
      <div class="lists">
        ${L("Em crescimento",grow,r=>fPct(r.varVol),"crescimento")}
        ${L("Em queda",dec,r=>fPct(r.varVol),"queda")}
        ${L("Inativas",ina,r=>pdf?"antes "+fBRL(r.prevVol):(r.daysSince+" dias"),"inativa")}
        ${L("Novas ou retomadas",nova,r=>fBRL(r.vol),"nova")}
        ${L("HEAD em risco",risk,r=>r.present?fPct(r.varVol):"sem movimento","inativa")}
        ${L("Oportunidade (ticket alto, baixa frequência)",opp,r=>fBRL(r.ticket)+" • "+r.trans+"x","nova")}
      </div>
      ${!pdf?html`<div class="note">Crescimento consistente (2ª metade do período maior que a 1ª): ${grow.filter(r=>r.consistente).map(r=>r.name).join(", ")||"nenhuma"}.</div>`:html`<div class="note">Com apenas dois recortes não dá para afirmar crescimento "consistente". "HEAD em risco" considera contas HEAD na data base ou na data de comparação.</div>`}</div>
    <div class="card c8"><h2>Matriz volume × crescimento</h2><div class="sub">Eixo X: volume na data base (escala log). Eixo Y: variação de volume (limitada a -100% e +300% para leitura).</div>
      <div style=${{width:"100%",height:340}}><${ResponsiveContainer}><${ScatterChart} margin=${{top:10,right:16,bottom:10,left:4}}>
        <${CartesianGrid} stroke=${T.grid}/>
        <${XAxis} type="number" dataKey="x" name="Volume" scale="log" domain=${["auto","auto"]} tickFormatter=${fBRLk} tick=${{fill:T.muted,fontSize:11}} stroke=${T.line}/>
        <${YAxis} type="number" dataKey="y" name="Variação" tickFormatter=${v=>v+"%"} tick=${{fill:T.muted,fontSize:11}} stroke=${T.line} width=${52}/>
        <${ZAxis} range=${[70,70]}/>
        <${ReferenceLine} x=${medV} stroke=${T.muted} strokeDasharray="4 4"/>
        <${ReferenceLine} y=${cfg.grow} stroke=${T.muted} strokeDasharray="4 4"/>
        <${Tooltip} content=${ScTip}/>
        <${Scatter} data=${sc} isAnimationActive=${false}>${sc.map((d,i)=>html`<${Cell} key=${i} fill=${stColor(T,d.status)} stroke=${T.surface} strokeWidth=${2}/>`)}<//>
      <//><//></div>
      <div class="mini">Linhas tracejadas: mediana de volume (${fBRL(medV)}) e corte de crescimento (${cfg.grow}%). Só entram empresas presentes nas duas datas.</div></div>
    <div class="card c4"><h2>Quadrantes</h2>
      <div class="quad">
        <div>Alto volume / alto crescimento<b>${qd.hh.length}</b><span class="mini">${qd.hh.map(d=>short(d.name,18)).join(", ")}</span></div>
        <div>Alto volume / baixo crescimento ou queda<b>${qd.hl.length}</b><span class="mini">${qd.hl.map(d=>short(d.name,18)).join(", ")}</span></div>
        <div>Baixo volume / alto crescimento<b>${qd.lh.length}</b><span class="mini">${qd.lh.map(d=>short(d.name,18)).join(", ")}</span></div>
        <div>Baixo volume / baixo crescimento ou queda<b>${qd.ll.length}</b><span class="mini">${qd.ll.map(d=>short(d.name,18)).join(", ")}</span></div>
      </div>
      <div class="mini"><span style=${{color:T.good}}>●</span> Crescimento <span style=${{color:T.neutral}}>●</span> Estabilidade <span style=${{color:T.warn}}>●</span> Queda</div></div>
  </div>`;}

function TabComercial({M,cfg,setCfg,f}){const T=useContext(TokCtx);const act=M.companies.filter(r=>r.present).sort((a,b)=>b.vol-a.vol);
  let cum=0;const pareto=act.map((r,i)=>{cum+=r.vol;return {name:String(i+1),full:r.name,v:cum/M.total*100,seg:r.seg};});
  const segs=["HEAD","MEDIUM","LONG TAIL"].map(s=>{const a=act.filter(r=>r.seg===s);const v=a.reduce((x,r)=>x+r.vol,0),t=a.reduce((x,r)=>x+r.trans,0);return {s,n:a.length,v,t,share:v/M.total*100,ticket:t?v/t:null};});
  const cross={};act.forEach(r=>{const k=r.seg+"|"+r.segT;(cross[k]=cross[k]||[]).push(r.name);});
  const S=["HEAD","MEDIUM","LONG TAIL"];
  const ins=buildInsights(M,cfg);

  return html`<div class="grid">
    <div class="card c12"><h2>Inteligência Operacional Stuo</h2><div class="sub">Achados gerados a partir dos dados da fonte ativa, com ação, indicador e período.</div>
      <div class="ins">${ins.map(i=>html`<div class="insc"><div style=${{display:"flex",justifyContent:"space-between",gap:"8px"}}><span class="t">${i.t}</span><${Tag} k=${i.k}/></div>
        <div>${i.a}</div><div class="r"><b>Ação</b><span>${i.acao}</span><b>Indicador</b><span>${i.ind}</span><b>Período</b><span>${i.per}</span></div></div>`)}</div></div>

        <${CartesianGrid} vertical=${false} stroke=${T.grid}/>
        <${XAxis} dataKey="name" tick=${{fill:T.muted,fontSize:11}} stroke=${T.line} label=${{value:"posição",position:"insideBottomRight",offset:-2,fill:T.muted,fontSize:11}}/>
        <${YAxis} domain=${[0,100]} tickFormatter=${v=>v+"%"} tick=${{fill:T.muted,fontSize:11}} stroke=${T.line} width=${44}/>
        <${ReferenceLine} y=${cfg.t1} stroke=${T.series} strokeDasharray="4 4" label=${{value:"HEAD "+cfg.t1+"%",fill:T.muted,fontSize:11,position:"insideBottomRight"}}/>
        <${ReferenceLine} y=${cfg.t2} stroke=${T.info} strokeDasharray="4 4" label=${{value:"MEDIUM "+cfg.t2+"%",fill:T.muted,fontSize:11,position:"insideBottomRight"}}/>
        <${Tooltip} content=${Tip(v=>fPct(v,false))}/>
        <${Line} type="monotone" dataKey="v" name="Acumulado" stroke=${T.series} strokeWidth=${2} dot=${{r:3,fill:T.series,stroke:T.surface,strokeWidth:1}} isAnimationActive=${false}/>
      <//><//></div>
      <div style=${{display:"flex",gap:"14px",flexWrap:"wrap",alignItems:"flex-end"}}>
        <div class="f"><label for="t1">Limite HEAD: ${cfg.t1}%</label><input id="t1" type="range" min="50" max="90" step="1" value=${cfg.t1} onInput=${e=>setCfg({...cfg,t1:+e.target.value,t2:Math.max(cfg.t2,+e.target.value+1)})}/></div>
        <div class="f"><label for="t2">Limite MEDIUM: ${cfg.t2}%</label><input id="t2" type="range" min=${cfg.t1+1} max="99" step="1" value=${cfg.t2} onInput=${e=>setCfg({...cfg,t2:+e.target.value})}/></div>
        <button class="btn" onClick=${()=>setCfg({...cfg,t1:80,t2:95})}>Voltar ao padrão 80/95</button></div>

    <div class="card c5"><h2>Segmentos</h2>

      ${segs.map(s=>html`<tr><td><${Seg} s=${s.s}/></td><td class="n">${s.n}</td><td class="n">${fBRL(s.v)}</td><td class="n">${fPct(s.share,false)}</td><td class="n">${fBRL(s.ticket)}</td></tr>`)}</tbody></table></div>
      <h2 style=${{fontSize:"14px"}}>Volume × transações</h2><div class="sub">Linhas: segmento por volume. Colunas: por transações. Fora da diagonal estão os perfis desalinhados.</div>
      <div class="tbl"><table><thead><tr><th></th>${S.map(s=>html`<th>${s}</th>`)}</tr></thead><tbody>
      ${S.map(a=>html`<tr><td><${Seg} s=${a}/></td>${S.map(b=>{const l=cross[a+"|"+b]||[];return html`<td style=${{background:a===b?"var(--surface-2)":"transparent"}}><b>${l.length}</b>${l.length&&a!==b?html`<div class="mini">${l.map(x=>short(x,22)).join(", ")}</div>`:null}</td>`;})}</tr>`)}</tbody></table></div></div>
    ${M.source==="pdf"?html`<div class="card c12"><h2>Cidades com maior volume</h2><div class="sub">${M.baseLabel}. Dado consolidado por cidade, sem cruzamento com empresa.</div>

function TabQualidade({M,cfg,imp}){const D=REPORT.daily,R=REPORT.resumo;
  const chk=REPORT.dates.map((d,i)=>{const sv=PDF.empresas.reduce((s,e)=>s+(e.v[i]||0),0),st=PDF.empresas.reduce((s,e)=>s+(e.t[i]||0),0),n=PDF.empresas.filter(e=>e.v[i]!=null).length,cv=PDF.cidades.reduce((s,c)=>s+(c.v[i]||0),0);
    return {d:d.k,sv,st,n,cv,okV:Math.abs(sv-D.vol[i])<0.01,okT:st===D.trans[i],okN:n===D.emp[i],okC:Math.abs(cv-D.vol[i])<0.01};});
  const recSum=R.dia.recMot+R.dia.recAntecip+R.dia.recRT+R.dia.recCliente+R.dia.conexao;
  const ok=b=>b?html`<span class="ok">✓ confere</span>`:html`<span class="bad">✗ diverge</span>`;
  return html`<div class="grid">
    <div class="card c12"><h2>Validação dos totais extraídos</h2><div class="sub">Soma das linhas por empresa e por cidade comparada aos consolidados da p.3</div>
      <div class="tbl"><table><thead><tr><th>Data</th><th class="n">Soma volume empresas</th><th class="n">Consolidado</th><th></th><th class="n">Soma transações</th><th class="n">Consolidado</th><th></th><th class="n">Nº empresas</th><th></th><th class="n">Soma volume cidades</th><th></th></tr></thead><tbody>
      ${chk.map((c,i)=>html`<tr><td>${c.d}</td><td class="n">${fBRL(c.sv)}</td><td class="n">${fBRL(D.vol[i])}</td><td>${ok(c.okV)}</td><td class="n">${fInt(c.st)}</td><td class="n">${fInt(D.trans[i])}</td><td>${ok(c.okT)}</td><td class="n">${c.n} / ${D.emp[i]}</td><td>${ok(c.okN)}</td><td class="n">${fBRL(c.cv)}</td><td>${ok(c.okC)}</td></tr>`)}</tbody></table></div>
      <div class="note">Receita do dia (p.2): soma das componentes ${fBRL(recSum)} vs receita total ${fBRL(R.dia.receita)} ${ok(Math.abs(recSum-R.dia.receita)<0.02)}. Soma de transações por hora (p.4): 126 ${ok(Object.values(REPORT.hourly.trans).reduce((a,b)=>a+b,0)===126)}.</div></div>
    <div class="card c6"><h2>Divergências encontradas no relatório</h2><ul class="dq">
      <li>Receita total de 22/11: <b>${fBRL(R.dia.receita)}</b> na p.2 e <b>${fBRL(D.receita[0])}</b> na p.3. Componentes também diferem (adm. motorista ${fBRL(R.dia.recMot)} vs ${fBRL(D.admMot[0])}).</li>
      <li>Acumulado do mês: volume ${fBRL(R.mes.volTrans)} (p.2) vs ${fBRL(REPORT.mtd.vol[3])} (p.3); transações ${fInt(R.mes.trans)} vs ${fInt(REPORT.mtd.trans[3])}; receita ${fBRL(R.mes.receita)} vs ${fBRL(REPORT.mtd.receita[3])}. Provável diferença de horário de extração.</li>
      <li>Cancelamentos do dia: p.2 indica 1 de usuário e 5 de taxistas (6); p.6 indica 5 canceladas (80% motorista, 20% usuário).</li>
      <li>Empresas no dia: 21 na p.3 e na lista por empresa; 23 "empresas associadas" na p.2.</li>
      <li>Soma por cidade diverge do consolidado em 15/11, 22/10 e 22/11/2025 (diferenças pequenas).</li>
      <li>Receita total de 22/11/2025 e taxa de conexão dessa data não aparecem na p.3.</li>
      <li>As páginas de chamadas e usuários não atendidos (p.7 e p.8 do sumário) vieram em branco.</li></ul></div>
    <div class="card c6"><h2>O que o PDF permite e o que não permite</h2><ul class="dq">

      <li><b>Depende de base transacional</b> (data, hora, empresa, ID da corrida, status, valor): melhor dia e horário por empresa, mapa de calor completo, inatividade por 15/30/60 dias, crescimento consistente, comparação semanal, filtros por grupo econômico e canal por empresa.</li>

      <li>Células vazias foram tratadas como "sem registro", nunca como zero. A segmentação considera apenas empresas com volume na data base.</li></ul></div>
    ${imp?html`<div class="card c12"><h2>Base importada</h2><div class="mini">Colunas reconhecidas: ${Object.entries(imp.m).map(([k,v])=>k+" → "+v).join("; ")}</div><ul class="dq">${imp.issues.map(i=>html`<li>${i}</li>`)}</ul></div>`:null}
  </div>`;}

function Importar({onLoad,imp,clear}){const [over,setOver]=useState(false);const [msg,setMsg]=useState("");
  const HDR="data;hora;empresa;grupo_economico;id_corrida;status;valor;canal_chamada;canal_pagamento;usuario";
  const handle=async file=>{try{setMsg("Lendo "+file.name+"…");let raw;
      if(/\.(xlsx|xls)$/i.test(file.name)){const wb=XLSX.read(await file.arrayBuffer(),{type:"array",cellDates:true});raw=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:"",raw:true});}
      else raw=parseCSV(await file.text());
      if(!raw.length){setMsg("O arquivo não tem linhas de dados.");return;}
      const r=normalizeRows(raw);if(!r.rows.length){setMsg("Não foi possível usar o arquivo. "+r.issues.join(" ")+" Colunas encontradas: "+r.keys.join(", "));return;}
      onLoad(r,file.name);setMsg(fInt(r.rows.length)+" registros carregados de "+file.name+".");}catch(e){setMsg("Erro ao ler o arquivo: "+e.message);}};
  const copy=()=>{try{navigator.clipboard.writeText(HDR).then(()=>setMsg("Cabeçalho copiado."),()=>setMsg("Copie manualmente: "+HDR));}catch(e){setMsg("Copie manualmente: "+HDR);}};
  return html`<div class="grid"><div class="card c12"><h2>Importar base transacional</h2>
    <div class="sub">CSV (separado por ; ou ,) ou Excel. Os dados ficam só neste navegador e não são enviados para lugar nenhum.</div>
    <label class=${"drop"+(over?" on":"")} onDragOver=${e=>{e.preventDefault();setOver(true);}} onDragLeave=${()=>setOver(false)} onDrop=${e=>{e.preventDefault();setOver(false);if(e.dataTransfer.files[0])handle(e.dataTransfer.files[0]);}}>
      <div style=${{fontWeight:600,color:"var(--fg)"}}>Arraste o arquivo aqui ou clique para escolher</div>
      <div class="mini">Obrigatórias: data, empresa, valor. Recomendadas: hora, id_corrida, status, grupo_economico, canal_chamada, canal_pagamento, usuario.</div>
      <input type="file" id="arq" accept=".csv,.txt,.xlsx,.xls" style=${{display:"none"}} onChange=${e=>e.target.files[0]&&handle(e.target.files[0])}/></label>
    <div style=${{display:"flex",gap:"8px",flexWrap:"wrap",alignItems:"center"}}>
      <code style=${{overflowWrap:"anywhere"}}>${HDR}</code><button class="btn" onClick=${copy}>Copiar cabeçalho modelo</button>
      ${imp?html`<button class="btn" onClick=${clear}>Voltar para o PDF</button>`:null}</div>
    ${msg?html`<div class="note">${msg}</div>`:null}
    ${imp?html`<ul class="dq">${imp.issues.map(i=>html`<li>${i}</li>`)}</ul>`:null}
    <div class="note">Com a base carregada, todas as abas passam a usar o período escolhido no filtro e o período anterior de mesmo tamanho. Status reconhecidos como concluídos: concluída, finalizada, fechada, realizada, paga. Cancelamentos ficam fora das corridas.</div></div></div>`;}

               ${F("fc","Comparar com",cfg.comp,v=>setCfg({...cfg,comp:+v}),[[-1,"Nenhum"],...REPORT.dates.map((d,i)=>[i,enDateDow(d.k)+(d.di===REPORT.dates[cfg.base].di?" • mesmo dia":"")]).filter(o=>o[0]!==cfg.base)])}`}
        <${BuscaEmpresa} names=${names} value=${f.empresa} onChange=${v=>setF({...f,empresa:v})}/>
        ${F("fg","Grupo econômico",f.grupo,v=>setF({...f,grupo:v}),[["","Todos"],...opts("grupo").map(o=>[o,o])],!csv||!imp.m.grupo,ndT)}
        ${F("fs","Segmento",f.segment,v=>setF({...f,segment:v}),[["","Todos"],["HEAD","HEAD"],["MEDIUM","MEDIUM"],["LONG TAIL","LONG TAIL"],["SEM","Sem volume na base"]])}
        ${F("fst","Status",f.status,v=>setF({...f,status:v}),[["","Todos"],...Object.entries(ST_LABEL)])}
        ${F("fd","Dia da semana",f.dow,v=>setF({...f,dow:v}),[["","Todos"],...DOW.map((d,i)=>[String(i),d])])}
        ${F("fh","Faixa horária",f.band,v=>setF({...f,band:v}),BANDS.map(b=>[b.k,b.n]))}
        ${F("fcc","Canal de chamada",f.canalCh,v=>setF({...f,canalCh:v}),[["","Todos"],...opts("canalCh").map(o=>[o,o])],!csv||!imp.m.canalCh,ndT)}
        ${F("fcp","Canal de pagamento",f.canalPg,v=>setF({...f,canalPg:v}),[["","Todos"],...opts("canalPg").map(o=>[o,o])],!csv||!imp.m.canalPg,ndT)}
      </div>
      ${!csv&&(f.dow!==""||f.band)&&tab!=="tempo"?html`<div class="note warn">Com o PDF, dia da semana e faixa horária só filtram os gráficos de horário (aba Dias e Horários); os dados por empresa são diários e não têm hora.</div>`:null}`:null}
      ${tab==="exec"?html`<${TabExec} M=${M} cfg=${cfg} f=${f}/>`:null}
      ${tab==="rank"?html`<${TabRanking} M=${M} f=${f} setF=${setF} cfgBase=${cfg.base}/>`:null}
      ${tab==="tempo"?html`<${TabTempo} M=${M} f=${f}/>`:null}
      ${tab==="risco"?html`<${TabRisco} M=${M} cfg=${cfg} setCfg=${setCfg} f=${f}/>`:null}
      ${tab==="com"?html`<${TabComercial} M=${M} cfg=${cfg} setCfg=${setCfg} f=${f}/>`:null}
      ${tab==="dados"?html`<${TabQualidade} M=${M} cfg=${cfg} imp=${imp}/>`:null}
      ${tab==="importar"?html`<${Importar} imp=${imp} onLoad=${(r,n)=>{setImp(r);setImpName(n);setF({empresa:"",segment:"",status:"",dow:"",band:"",grupo:"",canalCh:"",canalPg:""});}} clear=${()=>{setImp(null);setImpName("");}}/>`:null}
      <div class="mini" style=${{marginTop:"8px"}}>Fonte: ${csv?impName+" (base importada); consolidados financeiros: "+REPORT.fonte:REPORT.fonte}. Selos: <${Tag} k="real"/> lido do relatório, <${Tag} k="der"/> calculado, <${Tag} k="nd"/> indisponível na fonte.</div>
    </main></div><//>`;}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
})();
</script>
